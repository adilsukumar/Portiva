<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="220" viewBox="0 0 1120 220" role="img" aria-labelledby="t d"><title id="t">Portable core tests need Python 3.11+, JDK 17+ and C++17. They do not need an Android SDK, model download, phone or robot.</title><desc id="d">Portable core tests need Python 3.11+, JDK 17+ and C++17. They do not need an Android SDK, model download, phone or robot. Conceptual documentation artwork, not a photograph or proof of physical operation.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes wheel{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.25}}@keyframes bob{50%{transform:translateY(-4px)}}.wheel{transform-box:fill-box;transform-origin:center;animation:wheel 12s linear infinite}.breathe{animation:breathe 5s ease-in-out infinite}.bob{animation:bob 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.wheel,.breathe,.bob{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="1072" height="190" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(46 38) scale(1.0)"><path d="M4 7h36v31H4zM11 16l7 7-7 7M25 30h8" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="110" y="72" font-family="Bahnschrift, Arial, sans-serif" font-size="27" font-weight="600" fill="#F8F8F3" >START WITH THE PORTABLE CORE</text><text x="46" y="128" font-family="Bahnschrift, Arial, sans-serif" font-size="27" font-weight="600" fill="#F3D962" >Python 3.11+  /  JDK 17+  /  C++17</text><text x="46" y="173" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="400" fill="#BCFCF6" >No phone, robot, model download or Android SDK needed.</text></svg>