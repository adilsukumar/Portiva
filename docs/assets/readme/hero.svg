<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img" aria-labelledby="t d"><title id="t">Portiva. A helping hand that moves with you. Home-robot development software; physical motor output remains disabled. Concept trolley and synthetic map illustration.</title><desc id="d">Portiva. A helping hand that moves with you. Home-robot development software; physical motor output remains disabled. Concept trolley and synthetic map illustration. Conceptual documentation artwork, not a photograph or proof of physical operation.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes wheel{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.25}}@keyframes bob{50%{transform:translateY(-4px)}}.wheel{transform-box:fill-box;transform-origin:center;animation:wheel 12s linear infinite}.breathe{animation:breathe 5s ease-in-out infinite}.bob{animation:bob 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.wheel,.breathe,.bob{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="47" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" fill="#BCFCF6" >PORTIVA / ROBOTICS &amp; EMBEDDED SYSTEMS</text><text x="25" y="236" font-family="Bahnschrift, Arial, sans-serif" font-size="185" font-weight="700" fill="url(#foil)" letter-spacing="-5">PORTIVA</text><text x="32" y="329" font-family="Bahnschrift, Arial, sans-serif" font-size="64" font-weight="600" fill="#F8F8F3" >A helping hand.</text><text x="32" y="402" font-family="Bahnschrift, Arial, sans-serif" font-size="54" font-weight="600" fill="#FF4081" >That moves with you.</text><text x="32" y="463" font-family="Bahnschrift, Arial, sans-serif" font-size="27" font-weight="400" fill="#BCFCF6" >A home-robot project for following, carrying</text><text x="32" y="497" font-family="Bahnschrift, Arial, sans-serif" font-size="27" font-weight="400" fill="#BCFCF6" >and room-to-room delivery.</text><g transform="translate(812 380) scale(1.12)"><g class="bob"><path d="M0 53L128 53L172 28H44z" fill="#29243D" stroke="#A783F7" stroke-width="2"/><path d="M0 53v13h128l44-25v-13M128 53v13" fill="none" stroke="#BCFCF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 137L128 137L172 112H44z" fill="#29243D" stroke="#A783F7" stroke-width="2"/><path d="M0 137v13h128l44-25v-13M128 137v13" fill="none" stroke="#BCFCF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 227L128 227L172 202H44z" fill="#29243D" stroke="#A783F7" stroke-width="2"/><path d="M0 227v13h128l44-25v-13M128 227v13" fill="none" stroke="#BCFCF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M4 53V244M124 53v191M168 29v191M48 29v25" fill="none" stroke="#BCFCF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="35" y="82" width="59" height="28" rx="4" fill="#40364D" stroke="#FF4081"/><path d="M65 82v28" fill="none" stroke="#FF4081" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><rect x="47" y="169" width="48" height="31" rx="5" fill="#282A35" stroke="#F3D962"/><circle cx="22" cy="251" r="18" fill="#141320" stroke="#BCFCF6" stroke-width="3"/><g class="wheel"><path d="M12 251h20M22 241v20" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="117" cy="251" r="18" fill="#141320" stroke="#BCFCF6" stroke-width="3"/><g class="wheel"><path d="M107 251h20M117 241v20" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="160" cy="226" r="18" fill="#141320" stroke="#BCFCF6" stroke-width="3"/><g class="wheel"><path d="M150 226h20M160 216v20" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="107" y="1" width="35" height="23" rx="5" fill="#141320" stroke="#FF4081"/><circle cx="125" cy="12" r="6" fill="#BCFCF6"/><path d="M133 -16q24 7 20 25M138 -29q40 10 33 41" fill="none" stroke="#FF4081" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="breathe"/></g></g><path d="M32 570h270v125H32zM122 570v75M212 615v80" fill="none" stroke="#343044" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M67 608v64h110v-60h85" fill="none" stroke="#A783F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="67" cy="608" r="7" fill="#BCFCF6"/><circle cx="262" cy="612" r="7" fill="#FF4081" class="breathe"/><text x="32" y="728" font-family="Bahnschrift, Arial, sans-serif" font-size="18" font-weight="600" fill="#A783F7" >SYNTHETIC MAP / CONCEPT STUDY</text><text x="32" y="796" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" fill="#F3D962" >DEVELOPMENT SOFTWARE / PHYSICAL MOTION DISABLED</text><text x="770" y="704" font-family="Bahnschrift, Arial, sans-serif" font-size="20" font-weight="600" fill="#A783F7" >CONCEPT ILLUSTRATION</text></svg>