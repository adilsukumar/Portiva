<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1095" viewBox="0 0 640 1095" role="img" aria-labelledby="t d"><title id="t">Intended mission sequence: follow, stop and load, choose a room, deliver, confirm unloaded, and return. Physical autonomous behavior remains unvalidated.</title><desc id="d">Intended mission sequence: follow, stop and load, choose a room, deliver, confirm unloaded, and return. Physical autonomous behavior remains unvalidated. Conceptual documentation artwork, not a photograph or proof of physical operation.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes wheel{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.25}}@keyframes bob{50%{transform:translateY(-4px)}}.wheel{transform-box:fill-box;transform-origin:center;animation:wheel 12s linear infinite}.breathe{animation:breathe 5s ease-in-out infinite}.bob{animation:bob 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.wheel,.breathe,.bob{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="165" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(44 32) scale(0.9090909090909091)"><path d="M14 4a6 6 0 1 1 0 12a6 6 0 1 1 0-12M4 34q0-15 10-15t10 15M29 16l12 7-12 7" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="61" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" fill="#F3D962" >1 / FOLLOW</text><text x="46" y="112" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Stay near the selected person.</text><rect x="24" y="192" width="592" height="165" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(44 212) scale(0.9090909090909091)"><path d="M6 14l16-9 16 9v20l-16 9-16-9zM6 14l16 9 16-9M22 23v20M14 9l17 10" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="241" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" fill="#F3D962" >2 / STOP &amp; LOAD</text><text x="46" y="292" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Pause for loading everyday items.</text><rect x="24" y="372" width="592" height="165" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(44 392) scale(0.9090909090909091)"><path d="M5 40V4h31v36M13 40V12h15v28M23 25h1M5 40h35" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="421" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" fill="#F3D962" >3 / CHOOSE A ROOM</text><text x="46" y="472" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Select a registered destination.</text><rect x="24" y="552" width="592" height="165" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(44 572) scale(0.9090909090909091)"><path d="M3 29h29V12H12v17M32 20h7l4 9v6H3M9 35a4 4 0 1 0 8 0M31 35a4 4 0 1 0 8 0" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="601" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" fill="#F3D962" >4 / DELIVER</text><text x="46" y="652" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Plan and navigate the mission.</text><rect x="24" y="732" width="592" height="165" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(44 752) scale(0.9090909090909091)"><path d="M8 22v17h28V22M22 4v23M13 13l9-9 9 9" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="781" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" fill="#F3D962" >5 / CONFIRM UNLOADED</text><text x="46" y="832" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Wait for explicit confirmation.</text><rect x="24" y="912" width="592" height="165" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(44 932) scale(0.9090909090909091)"><path d="M18 7L6 19l12 12M6 19h20q12 0 12 13v6" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="961" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" fill="#F3D962" >6 / RETURN</text><text x="46" y="1012" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Go back to the departure point.</text></svg>