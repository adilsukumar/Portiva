<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" role="img" aria-labelledby="t d"><title id="t">Software component map: camera and Android candidates with live measured adapter pending; authenticated mission coordinator; shared planner and controllers; Uno sensors and watchdog. Physical output is disabled.</title><desc id="d">Software component map: camera and Android candidates with live measured adapter pending; authenticated mission coordinator; shared planner and controllers; Uno sensors and watchdog. Physical output is disabled. Conceptual documentation artwork, not a photograph or proof of physical operation.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes wheel{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.25}}@keyframes bob{50%{transform:translateY(-4px)}}.wheel{transform-box:fill-box;transform-origin:center;animation:wheel 12s linear infinite}.breathe{animation:breathe 5s ease-in-out infinite}.bob{animation:bob 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.wheel,.breathe,.bob{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="205" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(44 34) scale(0.9090909090909091)"><path d="M4 12h9l4-7h11l4 7h9v28H4zM22 19a8 8 0 1 0 0 16a8 8 0 1 0 0-16" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="62" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" fill="#F3D962" >CAMERA &amp; ANDROID</text><text x="46" y="120" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >ESP32-CAM, local Wi-Fi, vision and pose</text><text x="46" y="154" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >candidates. Live measured adapter is</text><text x="46" y="188" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >pending.</text><rect x="24" y="232" width="592" height="205" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(44 254) scale(0.9090909090909091)"><path d="M7 36V9h9v10h13V7h8v30M7 36h30" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="282" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" fill="#F3D962" >MISSION COORDINATOR</text><text x="46" y="340" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Authenticated requests, follow/delivery</text><text x="46" y="374" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >states, recorded origin and explicit</text><text x="46" y="408" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >return.</text><rect x="24" y="452" width="592" height="205" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(44 474) scale(0.9090909090909091)"><path d="M4 12l18-9 18 9-18 9zM4 23l18 9 18-9M4 34l18 9 18-9" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="502" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" fill="#F3D962" >PLANNER &amp; CONTROLLERS</text><text x="46" y="560" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Shared Java rectangle planner, swept-body</text><text x="46" y="594" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >checks and reference velocities.</text><rect x="24" y="672" width="592" height="205" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(44 694) scale(0.9090909090909091)"><path d="M14 3h16l12 12v16L30 43H14L2 31V15zM22 12v14M22 34h.1" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="722" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" fill="#F3D962" >UNO &amp; OUTPUT GUARD</text><text x="46" y="780" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Sensor telemetry and watchdog firmware.</text><text x="46" y="814" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Physical motor output stays disabled.</text></svg>