<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="t d"><title id="t">Development software exists and simulated workflows pass; real autonomous operation and the complete carrying assembly are unvalidated. Motor outputs are locked at zero.</title><desc id="d">Development software exists and simulated workflows pass; real autonomous operation and the complete carrying assembly are unvalidated. Motor outputs are locked at zero. Conceptual documentation artwork, not a photograph or proof of physical operation.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes wheel{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.25}}@keyframes bob{50%{transform:translateY(-4px)}}.wheel{transform-box:fill-box;transform-origin:center;animation:wheel 12s linear infinite}.breathe{animation:breathe 5s ease-in-out infinite}.bob{animation:bob 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.wheel,.breathe,.bob{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="340" height="270" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(44 34) scale(0.9090909090909091)"><path d="M14 10L3 22l11 12M30 10l11 12-11 12M26 5l-8 34" fill="none" stroke="#BCFCF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="62" font-family="Bahnschrift, Arial, sans-serif" font-size="27" font-weight="600" fill="#BCFCF6" >SOFTWARE</text><text x="46" y="115" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#F8F8F3" >Android demo, mission</text><text x="46" y="149" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#F8F8F3" >controllers, camera</text><text x="46" y="183" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#F8F8F3" >tools and board</text><text x="46" y="217" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#F8F8F3" >firmware.</text><rect x="389" y="12" width="340" height="270" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(409 34) scale(0.9090909090909091)"><path d="M16 4h12M19 4v15L7 37q-1 4 4 4h22q5 0 4-4L25 19V4M13 29h18" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="466" y="62" font-family="Bahnschrift, Arial, sans-serif" font-size="27" font-weight="600" fill="#A783F7" >VALIDATION</text><text x="411" y="115" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#F8F8F3" >Simulated workflows</text><text x="411" y="149" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#F8F8F3" >pass. Real autonomous</text><text x="411" y="183" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#F8F8F3" >use and the full</text><text x="411" y="217" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#F8F8F3" >assembly remain</text><text x="411" y="251" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#F8F8F3" >unvalidated.</text><rect x="754" y="12" width="340" height="270" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(774 34) scale(0.9090909090909091)"><path d="M14 3h16l12 12v16L30 43H14L2 31V15zM22 12v14M22 34h.1" fill="none" stroke="#F3D962" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="831" y="62" font-family="Bahnschrift, Arial, sans-serif" font-size="27" font-weight="600" fill="#F3D962" >MOTION LOCK</text><text x="776" y="115" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#F8F8F3" >Motor outputs remain</text><text x="776" y="149" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#F8F8F3" >locked at zero.</text><text x="776" y="183" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#F8F8F3" >Hardware commissioning</text><text x="776" y="217" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#F8F8F3" >is still required.</text></svg>