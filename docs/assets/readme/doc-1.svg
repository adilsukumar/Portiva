<svg xmlns="http://www.w3.org/2000/svg" width="520" height="136" viewBox="0 0 520 136" role="img" aria-labelledby="t d"><title id="t">Architecture. How the software fits together</title><desc id="d">Architecture. How the software fits together Conceptual documentation artwork, not a photograph or proof of physical operation.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes wheel{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.25}}@keyframes bob{50%{transform:translateY(-4px)}}.wheel{transform-box:fill-box;transform-origin:center;animation:wheel 12s linear infinite}.breathe{animation:breathe 5s ease-in-out infinite}.bob{animation:bob 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.wheel,.breathe,.bob{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="2" y="2" width="516" height="132" rx="17" fill="#141320" stroke="#343044"/><g transform="translate(20 24) scale(0.9090909090909091)"><path d="M4 12l18-9 18 9-18 9zM4 23l18 9 18-9M4 34l18 9 18-9" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="80" y="50" font-family="Bahnschrift, Arial, sans-serif" font-size="28" font-weight="600" fill="#F3D962" >Architecture</text><text x="21" y="104" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" fill="#BCFCF6" >How the software fits together</text></svg>