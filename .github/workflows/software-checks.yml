name: Software checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install host test libraries
        run: python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84 matplotlib==3.9.2
      - name: Run shared mission, geometry, protocol and calibration checks
        run: python implementation/check_core.py
